
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>हनुमान चालीसा | AAYUSH NEPALI SAHITYA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Noto Sans Devanagari", Arial, sans-serif;
    background: linear-gradient(135deg,#fff3e0,#ffcc80);
    color: #492000;
    transition: .3s;
}

body.dark {
    background: #17120f;
    color: #ffe0b2;
}

header {
    background: linear-gradient(120deg,#b71c1c,#ef6c00);
    color: white;
    text-align: center;
    padding: 28px 12px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    font-size: 14px;
}

.container {
    max-width: 950px;
    margin: 22px auto;
    padding: 15px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 5px 18px #0002;
}

.dark .panel {
    background: #29211c;
}

h2 {
    color: #d84315;
    margin-bottom: 15px;
}

.dark h2 {
    color: #ffab40;
}

.controls {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
    gap: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select, input[type="range"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #e0a36d;
    border-radius: 8px;
    background: #fffaf5;
}

button {
    border: none;
    padding: 11px 16px;
    margin: 5px 3px;
    border-radius: 9px;
    background: #e65100;
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:hover {
    background: #bf360c;
    transform: translateY(-1px);
}

button.secondary {
    background: #6d4c41;
}

button.green {
    background: #2e7d32;
}

button.blue {
    background: #1565c0;
}

.status {
    margin-top: 12px;
    padding: 12px;
    background: #fff3e0;
    border-radius: 8px;
    color: #8d3b00;
    font-weight: bold;
}

.dark .status {
    background: #403026;
    color: #ffcc80;
}

.verse {
    padding: 15px;
    margin: 12px 0;
    background: #fff8e1;
    border-left: 5px solid #ef6c00;
    border-radius: 8px;
    line-height: 2;
    font-size: 19px;
    white-space: pre-line;
}

.dark .verse {
    background: #382a20;
}

.verse button {
    font-size: 13px;
    padding: 7px 11px;
}

footer {
    text-align: center;
    padding: 25px;
    background: #4e260c;
    color: white;
    margin-top: 30px;
}

.top-buttons {
    text-align: center;
    margin: 15px 0;
}

@media(max-width:600px) {
    header h1 {font-size: 23px;}
    .verse {font-size: 17px;}
    .panel {padding: 14px;}
}
</style>
</head>

<body>

<header>
    <h1>🚩 श्री हनुमान चालीसा 🚩</h1>
    <p>भक्ति, श्रद्धा र सकारात्मकताको पवित्र पाठ</p>
    <p>AAYUSH NEPALI SAHITYA</p>
</header>

<div class="container">

    <div class="top-buttons">
        <button onclick="toggleTheme()">🌙 Dark / Light</button>
        <button onclick="changeFont(1)">A+ अक्षर ठूलो</button>
        <button onclick="changeFont(-1)">A- अक्षर सानो</button>
    </div>

    <section class="panel">
        <h2>🎵 आवाज तथा Speech Settings</h2>

        <div class="controls">

            <div>
                <label for="voiceSelect">आवाज छान्नुहोस्</label>
                <select id="voiceSelect">
                    <option value="">Default Voice</option>
                </select>
            </div>

            <div>
                <label for="styleSelect">Speech Style</label>
                <select id="styleSelect">
                    <option value="normal">Normal Reading</option>
                    <option value="bhajan">Bhajan Style</option>
                    <option value="rhythm">Rhythm Style</option>
                    <option value="slow">Slow Devotional</option>
                </select>
            </div>

            <div>
                <label for="rateControl">बोल्ने गति: <span id="rateValue">0.8</span></label>
                <input id="rateControl" type="range"
                    min="0.5" max="1.5" step="0.1" value="0.8">
            </div>

            <div>
                <label for="pitchControl">आवाजको Pitch: <span id="pitchValue">1</span></label>
                <input id="pitchControl" type="range"
                    min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

        <div style="margin-top:18px;text-align:center">
            <button class="green" onclick="playAll()">▶ पूरा पाठ</button>
            <button class="blue" onclick="pauseAudio()">⏸ Pause</button>
            <button class="green" onclick="resumeAudio()">▶ Resume</button>
            <button class="secondary" onclick="stopAudio()">⏹ Stop</button>
        </div>

        <div class="status" id="status">
            🙏 पाठ सुरु गर्न Play बटन थिच्नुहोस्।
        </div>
    </section>

    <section class="panel">
        <h2>📖 हनुमान चालीसा</h2>
        <div id="chalisaContent"></div>
    </section>

</div>

<footer>
    <p>🚩 जय श्री राम | जय हनुमान 🚩</p>
    <p>© AAYUSH NEPALI SAHITYA</p>
</footer>

<script>
const verses = [
`श्रीगुरु चरन सरोज रज, निज मनु मुकुरु सुधारि।
बरनऊँ रघुबर बिमल जसु, जो दायकु फल चारि॥`,

`बुद्धिहीन तनु जानिके, सुमिरौं पवन-कुमार।
बल बुद्धि विद्या देहु मोहिं, हरहु कलेस बिकार॥`,

`जय हनुमान ज्ञान गुन सागर।
जय कपीस तिहुँ लोक उजागर॥`,

`राम दूत अतुलित बल धामा।
अंजनि-पुत्र पवनसुत नामा॥`,

`महाबीर बिक्रम बजरंगी।
कुमति निवार सुमति के संगी॥`,

`कंचन बरन बिराज सुबेसा।
कानन कुण्डल कुंचित केसा॥`,

`हाथ बज्र औ ध्वजा बिराजै।
काँधे मूँज जनेऊ साजै॥`,

`शंकर सुवन केसरी नंदन।
तेज प्रताप महा जग वंदन॥`,

`विद्यावान गुनी अति चातुर।
राम काज करिबे को आतुर॥`,

`प्रभु चरित्र सुनिबे को रसिया।
राम लखन सीता मन बसिया॥`,

`सूक्ष्म रूप धरि सियहिं दिखावा।
विकट रूप धरि लंक जरावा॥`,

`भीम रूप धरि असुर सँहारे।
रामचंद्र के काज सँवारे॥`,

`लाय सजीवन लखन जियाये।
श्री रघुबीर हरषि उर लाये॥`,

`रघुपति कीन्ही बहुत बड़ाई।
तुम मम प्रिय भरतहि सम भाई॥`,

`सहस बदन तुम्हरो जस गावैं।
अस कहि श्रीपति कंठ लगावैं॥`,

`सनकादिक ब्रह्मादि मुनीसा।
नारद सारद सहित अहीसा॥`,

`जम कुबेर दिगपाल जहाँ ते।
कवि कोविद कहि सके कहाँ ते॥`,

`तुम उपकार सुग्रीवहिं कीन्हा।
राम मिलाय राज पद दीन्हा॥`,

`तुम्हरो मंत्र विभीषण माना।
लंकेश्वर भए सब जग जाना॥`,

`जुग सहस्र जोजन पर भानू।
लील्यो ताहि मधुर फल जानू॥`,

`प्रभु मुद्रिका मेलि मुख माहीं।
जलधि लाँघि गये अचरज नाहीं॥`,

`दुर्गम काज जगत के जेते।
सुगम अनुग्रह तुम्हरे तेते॥`,

`राम दुआरे तुम रखवारे।
होत न आज्ञा बिनु पैसारे॥`,

`सब सुख लहै तुम्हारी सरना।
तुम रक्षक काहू को डरना॥`,

`आपन तेज सम्हारो आपै।
तीनों लोक हाँक तें काँपै॥`,

`भूत पिशाच निकट नहिं आवै।
महाबीर जब नाम सुनावै॥`,

`नासै रोग हरै सब पीरा।
जपत निरंतर हनुमत बीरा॥`,

`संकट तें हनुमान छुड़ावै।
मन क्रम वचन ध्यान जो लावै॥`,

`सब पर राम तपस्वी राजा।
तिनके काज सकल तुम साजा॥`,

`और मनोरथ जो कोई लावै।
सोइ अमित जीवन फल पावै॥`,

`चारों जुग परताप तुम्हारा।
है परसिद्ध जगत उजियारा॥`,

`साधु संत के तुम रखवारे।
असुर निकंदन राम दुलारे॥`,

`अष्ट सिद्धि नौ निधि के दाता।
अस बर दीन जानकी माता॥`,

`राम रसायन तुम्हरे पासा।
सदा रहो रघुपति के दासा॥`,

`तुम्हरे भजन राम को पावै।
जनम जनम के दुख बिसरावै॥`,

`अंत काल रघुबर पुर जाई।
जहाँ जन्म हरि-भक्त कहाई॥`,

`और देवता चित्त न धरई।
हनुमत सेइ सर्व सुख करई॥`,

`संकट कटै मिटै सब पीरा।
जो सुमिरै हनुमत बलबीरा॥`,

`जय जय जय हनुमान गोसाईं।
कृपा करहु गुरुदेव की नाईं॥`,

`जो सत बार पाठ कर कोई।
छूटहि बंदि महा सुख होई॥`,

`जो यह पढ़ै हनुमान चालीसा।
होय सिद्धि साखी गौरीसा॥`,

`तुलसीदास सदा हरि चेरा।
कीजै नाथ हृदय महँ डेरा॥`,

`पवनतनय संकट हरन, मंगल मूरति रूप।
राम लखन सीता सहित, हृदय बसहु सुर भूप॥`
];

let currentIndex = 0;
let playing = false;
let fontSize = 19;
let voices = [];

const synth = window.speechSynthesis;

function renderVerses() {
    const area = document.getElementById("chalisaContent");
    area.innerHTML = "";

    verses.forEach((verse, index) => {
        const div = document.createElement("div");
        div.className = "verse";
        div.style.fontSize = fontSize + "px";

        const text = document.createElement("div");
        text.textContent = verse;

        const button = document.createElement("button");
        button.textContent = "🔊 यो श्लोक पढ्नुहोस्";
        button.onclick = () => readVerse(index);

        div.appendChild(text);
        div.appendChild(button);
        area.appendChild(div);
    });
}

function loadVoices() {
    voices = synth.getVoices();
    const select = document.getElementById("voiceSelect");
    const oldValue = select.value;

    select.innerHTML = '<option value="">Default Voice</option>';

    voices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = voice.name + " (" + voice.lang + ")";
        select.appendChild(option);
    });

    if (oldValue !== "") select.value = oldValue;
}

if ("speechSynthesis" in window) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
}

function getSpeechSettings() {
    let rate = Number(document.getElementById("rateControl").value);
    let pitch = Number(document.getElementById("pitchControl").value);

    const style = document.getElementById("styleSelect").value;

    if (style === "bhajan") {
        rate = Math.min(rate, 0.75);
        pitch = Math.max(pitch, 1.1);
    }

    if (style === "rhythm") {
        rate = Math.min(rate, 0.9);
    }

    if (style === "slow") {
        rate = 0.6;
    }

    return {rate, pitch};
}

function speak(text, onEnd) {
    if (!("speechSynthesis" in window)) {
        updateStatus("यो Browser मा Speech सुविधा उपलब्ध छैन।");
        return;
    }

    synth.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "hi-IN";

    const selectedVoice = document.getElementById("voiceSelect").value;

    if (selectedVoice !== "" && voices[selectedVoice]) {
        utterance.voice = voices[selectedVoice];
        utterance.lang = voices[selectedVoice].lang;
    }

    const settings = getSpeechSettings();
    utterance.rate = settings.rate;
    utterance.pitch = settings.pitch;

    utterance.onend = function() {
        if (onEnd) onEnd();
    };

    utterance.onerror = function() {
        updateStatus("आवाज चलाउन समस्या भयो। अर्को Voice छानेर प्रयास गर्नुहोस्।");
        playing = false;
    };

    synth.speak(utterance);
}

function playAll() {
    stopAudio();
    currentIndex = 0;
    playing = true;
    playNext();
}

function playNext() {
    if (!playing || currentIndex >= verses.length) {
        playing = false;
        updateStatus("🙏 पूरा पाठ समाप्त भयो। जय हनुमान!");
        return;
    }

    updateStatus("🔊 पाठ भइरहेको छ: " + (currentIndex + 1) + " / " + verses.length);

    speak(verses[currentIndex], function() {
        currentIndex++;
        if (playing) {
            setTimeout(playNext, 500);
        }
    });
}

function readVerse(index) {
    stopAudio();
    currentIndex = index;
    playing = false;
    updateStatus("🔊 श्लोक " + (index + 1) + " पढिँदैछ।");
    speak(verses[index]);
}

function pauseAudio() {
    if (synth.speaking && !synth.paused) {
        synth.pause();
        updateStatus("⏸ पाठ रोकिएको छ।");
    }
}

function resumeAudio() {
    if (synth.paused) {
        synth.resume();
        updateStatus("▶ पाठ फेरि सुरु भयो।");
    }
}

function stopAudio() {
    playing = false;
    synth.cancel();
    updateStatus("⏹ पाठ रोकियो।");
}

function updateStatus(message) {
    document.getElementById("status").textContent = message;
}

function changeFont(amount) {
    fontSize += amount;
    if (fontSize < 14) fontSize = 14;
    if (fontSize > 32) fontSize = 32;
    renderVerses();
}

function toggleTheme() {
    document.body.classList.toggle("dark");
}

document.getElementById("rateControl").addEventListener("input", function() {
    document.getElementById("rateValue").textContent = this.value;
});

document.getElementById("pitchControl").addEventListener("input", function() {
    document.getElementById("pitchValue").textContent = this.value;
});

renderVerses();
</script>

</body>
</html>
