<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>निबन्ध संग्रह | AAYUSH NEPALI SAHITYA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans Devanagari",sans-serif;
    background:#f4f6fa;
    color:#222;
    line-height:1.8;
    transition:0.3s;
}

header{
    background:linear-gradient(135deg,#153e75,#2675bd);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
}

.top-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:18px 0;
}

button,select{
    border:none;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
}

.top-buttons button{
    background:#ffca28;
    color:#222;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.search-area{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.search-area input,
.search-area select{
    flex:1;
    min-width:180px;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:white;
}

.count{
    margin-bottom:15px;
    color:#555;
    font-weight:bold;
}

.essay-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:17px;
}

.essay-card{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    border-left:5px solid #2675bd;
}

.essay-card h3{
    color:#174d85;
    margin-bottom:8px;
    font-size:19px;
}

.essay-card p{
    color:#555;
    font-size:14px;
}

.category{
    display:inline-block;
    background:#e4f0ff;
    color:#15518a;
    padding:3px 9px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.read-btn{
    background:#1769aa;
    color:white;
    margin-top:12px;
    width:100%;
}

.read-btn:hover{
    background:#104b7c;
}

.modal{
    display:none;
    position:fixed;
    z-index:10;
    inset:0;
    background:rgba(0,0,0,0.7);
    overflow-y:auto;
    padding:20px;
}

.modal-content{
    background:white;
    color:#222;
    max-width:800px;
    margin:30px auto;
    padding:25px;
    border-radius:12px;
    position:relative;
}

.modal-content h2{
    color:#174d85;
    margin-bottom:10px;
}

.modal-content p{
    margin:14px 0;
    text-align:justify;
    font-size:17px;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    background:#e53935;
    color:white;
    padding:6px 12px;
}

.reader-tools{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:15px 0;
}

.reader-tools button{
    background:#1769aa;
    color:white;
}

footer{
    background:#153e75;
    color:white;
    text-align:center;
    padding:22px;
    margin-top:35px;
}

body.dark{
    background:#151a23;
    color:#eee;
}

body.dark .essay-card,
body.dark .modal-content{
    background:#252d3a;
    color:#eee;
}

body.dark .essay-card h3,
body.dark .modal-content h2{
    color:#80c4ff;
}

body.dark .essay-card p{
    color:#ddd;
}

body.dark .search-area input,
body.dark .search-area select{
    background:#252d3a;
    color:white;
    border-color:#555;
}

body.dark .count{
    color:#ddd;
}

@media(max-width:600px){
    header h1{
        font-size:23px;
    }

    .container{
        padding:12px;
    }

    .modal-content{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 आयुस नेपाली साहित्य</h1>
    <p>नेपाली निबन्ध संग्रह — AAYUSH NEPALI SAHITYA</p>

    <div class="top-buttons">
        <button onclick="location.href='index.html'">🏠 गृहपृष्ठ</button>
        <button onclick="document.body.classList.toggle('dark')">🌙 Dark / Light</button>
    </div>
</header>

<div class="container">

    <h2>✍️ निबन्ध संग्रह</h2>

    <br>

    <div class="search-area">
        <input
            type="text"
            id="search"
            placeholder="निबन्धको नाम वा विषय खोज्नुहोस्..."
            oninput="showEssays()"
        >

        <select id="category" onchange="showEssays()">
            <option value="सबै">सबै विषय</option>
            <option value="राष्ट्र">राष्ट्र</option>
            <option value="शिक्षा">शिक्षा</option>
            <option value="विज्ञान">विज्ञान तथा प्रविधि</option>
            <option value="वातावरण">वातावरण</option>
            <option value="समाज">समाज</option>
            <option value="नैतिकता">नैतिकता</option>
            <option value="स्वास्थ्य">स्वास्थ्य तथा खेलकुद</option>
            <option value="संस्कृति">संस्कृति तथा पर्यटन</option>
            <option value="जीवन">जीवन तथा प्रेरणा</option>
        </select>
    </div>

    <div class="count" id="count"></div>

    <div class="essay-grid" id="essayList"></div>

</div>

<div class="modal" id="reader">
    <div class="modal-content">

        <button class="close" onclick="closeReader()">बन्द ✖</button>

        <h2 id="essayTitle"></h2>
        <p id="essayInfo"></p>

        <div class="reader-tools">
            <button onclick="changeFont(1)">A+ अक्षर ठूलो</button>
            <button onclick="changeFont(-1)">A- अक्षर सानो</button>
        </div>

        <div id="essayBody"></div>

    </div>
</div>

<footer>
    <h3>AAYUSH NEPALI SAHITYA</h3>
    <p>लेखक तथा सम्पादक: Aayush Jaishi</p>
    <p>नेपाली भाषा, साहित्य र सिर्जनाको साझा चौतारी।</p>
    <p>© 2026 Aayush Jaishi. All Rights Reserved.</p>
</footer>
