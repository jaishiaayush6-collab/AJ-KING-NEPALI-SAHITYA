
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAYUSH नेपाली साहित्य | कथा संग्रह</title>
<style>
:root {
  --bg:#f4f1ea; --surface:#fff; --text:#252525;
  --muted:#777; --primary:#8b3d25; --border:#e5ded2;
}
body.dark {
  --bg:#171717; --surface:#242424; --text:#f3eee7;
  --muted:#b9b1a7; --primary:#e99a70; --border:#414141;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
  line-height:1.8;transition:.25s;
}
header {
  background:linear-gradient(120deg,#542719,#a65332);
  color:white;padding:30px 18px;text-align:center;
}
header h1 {margin:0;font-size:clamp(25px,5vw,42px)}
header p {margin:8px 0 0}
nav {
  position:sticky;top:0;z-index:5;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px;
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}
button,select,input {
  font:inherit;border:1px solid var(--border);
  border-radius:9px;padding:9px 13px;
}
button {cursor:pointer;background:var(--primary);color:white;border:0}
button.secondary {background:var(--surface);color:var(--text);border:1px solid var(--border)}
button:hover {opacity:.85}
main {max-width:1150px;margin:auto;padding:22px 15px}
.toolbar {
  display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:18px;
}
input,select {width:100%;background:var(--surface);color:var(--text)}
.layout {display:grid;grid-template-columns:250px 1fr;gap:20px}
.panel,.story-card,.reader {
  background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:17px;
}
.panel {height:max-content}
.panel h3 {margin-top:0}
.category-list {display:grid;gap:7px}
.category-list button {
  text-align:left;background:transparent;color:var(--text);
  border:1px solid var(--border);
}
.category-list button.active {
  background:var(--primary);color:white;border-color:var(--primary);
}
.cards {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.story-card h3 {margin:4px 0;color:var(--primary)}
.story-card p {color:var(--muted);margin:5px 0 12px}
.meta {font-size:13px;color:var(--muted)}
.actions {display:flex;gap:8px;flex-wrap:wrap}
.reader {max-width:850px;margin:auto}
.reader h2 {color:var(--primary)}
.reader-content {font-size:var(--reader-size,18px);line-height:2.1}
.reader-content p {margin:0 0 18px;text-align:justify}
.hidden {display:none!important}
footer {text-align:center;padding:25px;color:var(--muted)}
#count {color:var(--muted);margin:10px 0}
@media(max-width:760px) {
 .layout {grid-template-columns:1fr}
 .cards {grid-template-columns:1fr}
 .toolbar {grid-template-columns:1fr}
 nav {position:static}
}
</style>
</head>
<body>
<header>
  <h1>📚 AAYUSH नेपाली साहित्य</h1>
  <p>नेपाली कथा संसारमा तपाईंलाई स्वागत छ</p>
  <p>कथा पढौँ, ज्ञान बढाऔँ, साहित्यलाई माया गरौँ।</p>
</header>

<nav>
  <button onclick="showHome()">🏠 गृहपृष्ठ</button>
  <button class="secondary" onclick="showFavorites()">❤️ मनपर्ने कथा</button>
  <button class="secondary" onclick="changeTheme()">🌙 थिम परिवर्तन</button>
  <button class="secondary" onclick="changeFont(-1)">अ−</button>
  <button class="secondary" onclick="changeFont(1)">अ+</button>
</nav>

<main>
  <section id="home">
    <h2>📖 नेपाली कथा संग्रह</h2>
    <div class="toolbar">
      <input id="search" placeholder="कथाको नाम वा शब्द खोज्नुहोस्..." oninput="renderStories()">
      <select id="sort" onchange="renderStories()">
        <option value="all">सबै कथाहरू</option>
        <option value="favorites">मनपर्ने कथाहरू</option>
      </select>
    </div>

    <div class="layout">
      <aside class="panel">
        <h3>📚 कथा विधाहरू</h3>
        <div id="categories" class="category-list"></div>
      </aside>
      <section>
        <h2 id="categoryTitle">सबै कथाहरू</h2>
        <div id="count"></div>
        <div id="storyCards" class="cards"></div>
      </section>
    </div>
  </section>

  <section id="reading" class="hidden">
    <button class="secondary" onclick="showHome()">← कथा सूचीमा फर्कनुहोस्</button>
    <article class="reader">
      <div class="meta" id="readCategory"></div>
      <h2 id="readTitle"></h2>
      <div class="actions">
        <button onclick="changeFont(-1)">अक्षर सानो</button>
        <button onclick="changeFont(1)">अक्षर ठूलो</button>
        <button class="secondary" id="readFavorite" onclick="toggleCurrentFavorite()">❤️ मनपर्ने</button>
      </div>
      <hr>
      <div id="readContent" class="reader-content"></div>
    </article>
  </section>
</main>

<footer>
  <p>© 2026 AAYUSH नेपाली साहित्य | नेपाली भाषा र साहित्यको सम्मान</p>
</footer>

let activeCategory = "सबै";
let currentStory = null;
let readerSize = 18;
let favorites = JSON.parse(localStorage.getItem("aayushFavorites") || "[]");

function saveFavorites(){
 localStorage.setItem("aayushFavorites",JSON.stringify(favorites));
}

function buildCategories(){
 const box=document.getElementById("categories");
 box.innerHTML="";
 const all=["सबै",...categories];
 all.forEach(cat=>{
  const btn=document.createElement("button");
  btn.textContent=cat;
  btn.className=activeCategory===cat?"active":"";
  btn.onclick=()=>{activeCategory=cat;buildCategories();renderStories();};
  box.appendChild(btn);
 });
}

function renderStories(){
 const query=document.getElementById("search").value.trim().toLowerCase();
 const onlyFav=document.getElementById("sort").value==="favorites";
 let list=stories.filter(s=>{
  const matchesCategory=activeCategory==="सबै"||s.category===activeCategory;
  const matchesSearch=(s.title+" "+s.category+" "+s.content.join(" ")).toLowerCase().includes(query);
  const matchesFav=!onlyFav||favorites.includes(s.id);
  return matchesCategory&&matchesSearch&&matchesFav;
 });
 document.getElementById("categoryTitle").textContent=activeCategory==="सबै"?"सबै कथाहरू":activeCategory;
 document.getElementById("count").textContent=`देखाइएका कथा: ${list.length}`;
 const box=document.getElementById("storyCards");
 box.innerHTML="";
 if(!list.length){
  box.innerHTML="<p>यस खोजमा कथा भेटिएन। अर्को शब्द प्रयोग गरेर खोज्नुहोस्।</p>";
  return;
 }
 list.forEach(s=>{
  const card=document.createElement("article");
  card.className="story-card";
  const excerpt=s.content.join(" ").slice(0,155)+"…";
  card.innerHTML=`
   <div class="meta">${escapeHTML(s.category)}</div>
   <h3>${escapeHTML(s.title)}</h3>
   <p>${escapeHTML(excerpt)}</p>
   <div class="actions">
    <button onclick="openStory(${s.id})">कथा पढ्नुहोस्</button>
    <button class="secondary" onclick="toggleFavorite(${s.id})">
     ${favorites.includes(s.id)?"❤️ हटाउनुहोस्":"♡ मनपर्ने"}
    </button>
   </div>`;
  box.appendChild(card);
 });
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function toggleFavorite(id){
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 saveFavorites();
 renderStories();
 if(currentStory&&currentStory.id===id){
  document.getElementById("readFavorite").textContent=
   favorites.includes(id)?"❤️ मनपर्नेमा छ":"♡ मनपर्नेमा राख्नुहोस्";
 }
}

function toggleCurrentFavorite(){
 if(currentStory)toggleFavorite(currentStory.id);
}

function openStory(id){
 const story=stories.find(s=>s.id===id);
 if(!story)return;
 currentStory=story;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("reading").classList.remove("hidden");
 document.getElementById("readCategory").textContent=story.category;
 document.getElementById("readTitle").textContent=story.title;
 document.getElementById("readContent").innerHTML=
  story.content.map(p=>`<p>${escapeHTML(p)}</p>`).join("");
 document.getElementById("readFavorite").textContent=
  favorites.includes(id)?"❤️ मनपर्नेमा छ":"♡ मनपर्नेमा राख्नुहोस्";
 document.getElementById("readContent").style.setProperty("--reader-size",readerSize+"px");
 window.scrollTo(0,0);
}

function showHome(){
 document.getElementById("reading").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 currentStory=null;
 renderStories();
}

function showFavorites(){
 document.getElementById("sort").value="favorites";
 activeCategory="सबै";
 buildCategories();
 showHome();
}

function changeTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("aayushTheme",document.body.classList.contains("dark")?"dark":"light");
}

function changeFont(amount){
 readerSize=Math.max(14,Math.min(30,readerSize+amount));
 if(currentStory){
  document.getElementById("readContent").style.fontSize=readerSize+"px";
 }
}

if(localStorage.getItem("aayushTheme")==="dark"){
 document.body.classList.add("dark");
}
buildCategories();
renderStories();
</script>
