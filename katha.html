
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAYUSH नेपाली साहित्य | कथा संग्रह</title>

<style>
:root {
  --bg:#f4f1ea;
  --surface:#fff;
  --text:#252525;
  --muted:#777;
  --primary:#8b3d25;
  --border:#e5ded2;
}

body.dark {
  --bg:#171717;
  --surface:#242424;
  --text:#f3eee7;
  --muted:#b9b1a7;
  --primary:#e99a70;
  --border:#414141;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
  line-height:1.8;
  transition:.25s;
}

header {
  background:linear-gradient(120deg,#542719,#a65332);
  color:white;
  padding:30px 18px;
  text-align:center;
}

header h1 {
  margin:0;
  font-size:clamp(25px,5vw,42px);
}

header p {margin:8px 0 0}

nav {
  position:sticky;
  top:0;
  z-index:5;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button,input,select {
  font:inherit;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 13px;
}

button {
  cursor:pointer;
  background:var(--primary);
  color:white;
  border:0;
}

button:hover {opacity:.85}

button.secondary {
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}

main {
  max-width:1150px;
  margin:auto;
  padding:22px 15px;
}

.toolbar {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

input,select {
  width:100%;
  background:var(--surface);
  color:var(--text);
}

.layout {
  display:grid;
  grid-template-columns:250px 1fr;
  gap:20px;
}

.panel,.story-card,.reader {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:17px;
}

.panel {height:max-content}

.panel h3 {margin-top:0}

.category-list {
  display:grid;
  gap:7px;
}

.category-list button {
  text-align:left;
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
}

.category-list button.active {
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.cards {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.story-card h3 {
  margin:4px 0;
  color:var(--primary);
}

.story-card p {
  color:var(--muted);
  margin:5px 0 12px;
}

.meta {
  font-size:13px;
  color:var(--muted);
}

.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.reader {
  max-width:850px;
  margin:auto;
}

.reader h2 {color:var(--primary)}

.reader-content {
  font-size:var(--reader-size,19px);
  line-height:2.1;
}

.reader-content p {
  margin:0 0 20px;
  text-align:justify;
}

.hidden {display:none!important}

#count {
  color:var(--muted);
  margin:10px 0;
}

footer {
  text-align:center;
  padding:25px;
  color:var(--muted);
}

@media(max-width:760px) {
  .layout {grid-template-columns:1fr}
  .cards {grid-template-columns:1fr}
  .toolbar {grid-template-columns:1fr}
  nav {position:static}
}
</style>
</head>

<body>

<header>
  <h1>📚 AAYUSH नेपाली साहित्य</h1>
  <p>नेपाली कथा संसारमा तपाईंलाई स्वागत छ</p>
  <p>कथा पढौँ, ज्ञान बढाऔँ, साहित्यलाई माया गरौँ।</p>
</header>

<nav>
  <button onclick="showHome()">🏠 गृहपृष्ठ</button>
  <button class="secondary" onclick="showFavorites()">❤️ मनपर्ने कथा</button>
  <button class="secondary" onclick="changeTheme()">🌙 थिम परिवर्तन</button>
  <button class="secondary" onclick="changeFont(-1)">अ−</button>
  <button class="secondary" onclick="changeFont(1)">अ+</button>
</nav>

<main>

<section id="home">
  <h2>📖 नेपाली कथा संग्रह</h2>

  <div class="toolbar">
    <input
      id="search"
      placeholder="कथाको नाम वा शब्द खोज्नुहोस्..."
      oninput="renderStories()"
    >

    <select id="sort" onchange="renderStories()">
      <option value="all">सबै कथाहरू</option>
      <option value="favorites">मनपर्ने कथाहरू</option>
    </select>
  </div>

  <div class="layout">

    <aside class="panel">
      <h3>📚 कथा विधाहरू</h3>
      <div id="categories" class="category-list"></div>
    </aside>

    <section>
      <h2 id="categoryTitle">सबै कथाहरू</h2>
      <div id="count"></div>
      <div id="storyCards" class="cards"></div>
    </section>

  </div>
</section>

<section id="reading" class="hidden">

  <button class="secondary" onclick="showHome()">
    ← कथा सूचीमा फर्कनुहोस्
  </button>

  <article class="reader">

    <div class="meta" id="readCategory"></div>

    <h2 id="readTitle"></h2>

    <div class="actions">
      <button onclick="changeFont(-1)">अक्षर सानो</button>
      <button onclick="changeFont(1)">अक्षर ठूलो</button>
      <button
        class="secondary"
        id="readFavorite"
        onclick="toggleCurrentFavorite()"
      >❤️ मनपर्ने</button>
    </div>

    <hr>

    <div id="readContent" class="reader-content"></div>

  </article>

</section>

</main>

<footer>
  <p>© 2026 AAYUSH नेपाली साहित्य</p>
  <p>नेपाली भाषा र साहित्यको सम्मान</p>
</footer>

<script>

const categories = [
"सामाजिक कथा",
"डर तथा रहस्य कथा",
"नैतिक कथा",
"बाल कथा",
"ऐतिहासिक कथा",
"लघुकथा",
"पारिवारिक कथा",
"प्राकृतिक कथा",
"वातावरण सम्बन्धी कथा",
"विज्ञान तथा प्रविधि कथा",
"वैज्ञानिक कथा",
"वैवाहिक कथा",
"सांस्कृतिक कथा",
"प्रेम कथा",
"विश्वसम्बन्धी कथा"
];

const stories = [

{
id:1,
category:"सामाजिक कथा",
title:"गाउँको साझा बाटो",
content:[
"नेपालको पहाडी भेगमा एउटा सुन्दर गाउँ थियो। चारैतिर हरिया डाँडाकाँडा, बीचबाट बग्ने सानो खोला र बिहानै चराहरूको चिरबिर आवाजले गाउँलाई स्वर्गजस्तै बनाएको थियो। गाउँका मानिसहरू खेतीपाती गरेर आफ्नो जीवन चलाउँथे। उनीहरूको जीवन सरल थियो, तर गाउँमा एउटा ठूलो समस्या थियो। गाउँको बीचबाट जाने पुरानो बाटो निकै साँघुरो थियो। वर्षायाममा हिलो र पहिरोले बाटो बन्द हुन्थ्यो भने हिउँदमा धुलोले हिँड्न गाह्रो बनाउँथ्यो।",
"त्यही बाटो भएर विद्यार्थी विद्यालय जान्थे, किसान खेतमा पुग्थे र बिरामीलाई स्वास्थ्य चौकी लैजान्थे। गाउँका ज्येष्ठ नागरिकले धेरै वर्षदेखि बाटो सुधार गर्नुपर्ने माग गर्दै आएका थिए। तर बाटोको केही भाग विभिन्न व्यक्तिको निजी जग्गामा पर्ने भएकाले कसैले जग्गा दिन चाहँदैनथे। गाउँको बैठक बस्दा पनि सबैले आ–आफ्नो कुरा मात्र राख्थे। यसरी गाउँको साझा समस्या वर्षौँसम्म समाधान हुन सकेन।",
"एक दिन लगातार वर्षा भयो। रातभर परेको पानीले बाटोको एक भाग भत्कियो। त्यही रात गाउँकी एक वृद्ध महिला अचानक बिरामी परिन्। उनलाई तत्काल स्वास्थ्य चौकी पुर्‍याउनुपर्ने भयो। तर बाटो अवरुद्ध भएकाले गाडी गाउँसम्म पुग्न सकेन। गाउँका युवाहरूले उनलाई बोकेर लैजानुपर्‍यो। त्यस घटनाले सबैलाई बाटोको वास्तविक महत्त्व बुझायो।",
"भोलिपल्ट गाउँका युवाहरूले सबैलाई बोलाएर छलफल आयोजना गरे। बैठकमा एक युवकले भने, 'हामीले वर्षौँदेखि आफ्नो जग्गाको मात्र कुरा गर्‍यौँ, तर यही बाटोले हाम्रा छोराछोरीलाई विद्यालय पुर्‍याउँछ र बिरामीलाई अस्पताल पुर्‍याउँछ भन्ने कुरा बिर्सियौँ।' उनको कुरा सुनेपछि गाउँका धेरै मानिस गम्भीर भए। एक वृद्ध किसानले आफ्नो जग्गाको सानो भाग बाटोका लागि दिने घोषणा गरे। त्यसपछि अरूले पनि सहयोग गर्ने प्रतिबद्धता जनाए।",
"केही दिनपछि गाउँमा श्रमदान अभियान सुरु भयो। कसैले ढुङ्गा बोके, कसैले माटो सम्याए, कसैले पानी र खाना ल्याए। विद्यालयका विद्यार्थीहरूले पनि आफ्नो उमेरअनुसार सहयोग गरे। गाउँका महिलाहरूले श्रमदान गर्नेहरूका लागि खाजा तयार पारे। सबैको मेहनत र सहकार्यले केही सातामै बाटो फराकिलो र सुरक्षित बन्यो।",
"बाटो बनेपछि गाउँको जीवनमा ठूलो परिवर्तन आयो। किसानले आफ्नो उत्पादन बजारसम्म सजिलै पुर्‍याउन थाले। विद्यार्थीलाई विद्यालय पुग्न सहज भयो। बिरामीलाई स्वास्थ्य चौकी लैजान पनि सजिलो भयो। गाउँमा पहिले भएको विवाद विस्तारै घट्दै गयो। मानिसहरू एकअर्काको दुःखमा साथ दिन थाले।",
"एक दिन गाउँको चौतारोमा बसेर सबैले बाटो निर्माणको सम्झना गरे। पहिले सानो जग्गाको विषयमा झगडा गर्ने मानिसहरू अहिले एउटै ठाउँमा बसेर चिया पिइरहेका थिए। गाउँका शिक्षकले भने, 'सडकले घरहरू मात्र जोड्दैन, यसले मन र सम्बन्ध पनि जोड्छ।' सबैले उनको कुरा स्वीकार गरे।",
"यस घटनाले गाउँलेहरूलाई एउटा ठूलो शिक्षा दियो। समाजको विकास व्यक्तिगत स्वार्थबाट होइन, सामूहिक भावना र सहकार्यबाट सम्भव हुन्छ। हामीले आफ्नो अधिकारसँगै अरूको आवश्यकतालाई पनि बुझ्नुपर्छ। एकता, सहयोग र आपसी सम्मान भएको समाज मात्र समृद्ध र शान्त बन्न सक्छ।"
]
},

{
id:2,
category:"डर तथा रहस्य कथा",
title:"पुरानो घरको रहस्य",
content:[
"पहाडको काखमा रहेको एउटा गाउँको अन्तिम छेउमा पुरानो घर थियो। घरको वरिपरि ठूला रुखहरू थिए। घरका झ्यालहरू भाँचिएका थिए र आँगनमा झारपात उम्रिएको थियो। धेरै वर्षदेखि त्यहाँ कोही बसेको थिएन। गाउँका बालबालिकाले त्यस घरबारे अनेकौँ कुरा सुनेका थिए। कसैले राति घरभित्र बत्ती बलेको देखेको भन्थे भने कसैले त्यहाँबाट अनौठो आवाज आउने बताउँथे। त्यसैले गाउँका मानिसहरू साँझ परेपछि त्यहाँ जान रुचाउँदैनथे।",
"त्यही गाउँमा आरव र सुमन नामका दुई विद्यार्थी बस्थे। उनीहरू विद्यालयको इतिहास परियोजनाका लागि गाउँका पुराना भवनबारे जानकारी संकलन गरिरहेका थिए। एक दिन शिक्षकले पुरानो घरको इतिहास खोज्न सुझाव दिए। सुरुमा दुवै साथी डराए। तर उनीहरूलाई सत्य कुरा पत्ता लगाउने जिज्ञासा पनि थियो। उनीहरूले पहिले गाउँका ज्येष्ठ नागरिकसँग कुरा गर्ने निर्णय गरे।",
"गाउँका एक वृद्धले उनीहरूलाई बताए कि त्यो घर कुनै समय हरिप्रसाद नामका शिक्षकको थियो। उनी गाउँका सबै बालबालिकालाई निःशुल्क पढाउँथे। उनले आफ्नो घरमा सानो पुस्तकालय पनि बनाएका थिए। गाउँका मानिसहरू उनलाई निकै सम्मान गर्थे। तर शिक्षकको निधनपछि उनका आफन्त शहर बसाइँ सरे र घर बन्द भयो। त्यसपछि घरको हेरचाह गर्ने कोही रहेन।",
"भोलिपल्ट आरव र सुमन शिक्षकको साथमा घर हेर्न गए। घरको ढोका पुरानो थियो, तर खोल्न सकिने अवस्थामा थियो। भित्र धुलोले ढाकिएका पुस्तकका दराजहरू थिए। भित्तामा पुराना तस्बिर झुन्डिएका थिए। एउटा कोठामा काठको बाकसभित्र डायरी, चिठी र विद्यालयका पुराना कागजात राखिएका थिए। उनीहरूले ती सामग्री ध्यानपूर्वक हेर्न थाले।",
"डायरीमा शिक्षकले लेखेका विचारहरू भेटिए। उनले गाउँका सबै बालबालिकाले शिक्षा पाउनुपर्छ भन्ने सपना देखेका रहेछन्। एउटा पानामा उनले आफ्नो घरलाई भविष्यमा सार्वजनिक पुस्तकालय बनाउने इच्छा व्यक्त गरेका थिए। त्यो पढेपछि दुवै विद्यार्थी निकै प्रभावित भए। उनीहरूले घरको रहस्य कुनै भूतप्रेत नभई अधुरो सपना रहेछ भन्ने बुझे।",
"राति सुनिने अनौठो आवाजको कारण पनि उनीहरूले पत्ता लगाए। घरको पछाडिको झ्यालको काठ खुकुलो भएको रहेछ। हावा चल्दा त्यो काठ भित्तामा ठोक्किन्थ्यो र अनौठो आवाज आउँथ्यो। कहिलेकाहीँ छानाबाट झर्ने पानी पुरानो भाँडोमा पर्दा पनि आवाज सुनिन्थ्यो। डरको कारण बनेका कुराहरू वास्तवमा सामान्य प्राकृतिक कारण थिए।",
"विद्यार्थीहरूले गाउँका मानिसहरूलाई घरको वास्तविक इतिहास सुनाए। सबैको सहयोगमा घर सफा गरियो। पुस्तकहरू मिलाइए र पुराना कागजात सुरक्षित राखिए। गाउँपालिकाको सहयोगमा त्यहाँ सानो सामुदायिक पुस्तकालय खोलियो। पुस्तकालयको नाम पुराना शिक्षक हरिप्रसादकै नाममा राखियो।",

content:[
"बसपार्कको एउटा बेन्चमुनि पुरानो पुस्तक भेटियो। मानिसहरू आउँथे, जान्थे, तर कसैले त्यसलाई ध्यान दिएका थिएनन्। विद्यालयबाट फर्कँदै गरेको सानो विद्यार्थीले पुस्तक देख्यो। उसले धुलो पुछेर पाना पल्टायो। पुस्तकभित्र विज्ञान, प्रकृति र मानव जीवनबारे रोचक जानकारी थियो।",
"उसले पुस्तक घर लगेर पढ्न थाल्यो। एउटा पानामा लेखिएको थियो—ज्ञान बाँड्दा घट्दैन, बरु बढ्छ। उसलाई त्यो वाक्य निकै मन पर्‍यो। भोलिपल्ट उसले पुस्तक विद्यालयको पुस्तकालयमा बुझायो। पुस्तकालयका शिक्षकले त्यसलाई सुरक्षित राखे र विद्यार्थीहरूलाई पढ्न दिए।",
"केही दिनमै धेरै विद्यार्थीले पुस्तक पढे। त्यसबाट उनीहरूलाई नयाँ विषयमा जिज्ञासा जाग्यो। शिक्षकले पुस्तक कसले ल्याएको हो भनेर सोध्दा त्यो विद्यार्थी अगाडि आयो। उसले भन्यो, 'मैले बाटोमा भेटेको ज्ञानलाई सबैसँग बाँड्न मात्र खोजेको हुँ।'",
"एउटा बेवास्ता गरिएको पुस्तकले धेरै विद्यार्थीको सोचमा नयाँ ढोका खोल्यो। कहिलेकाहीँ सानो राम्रो कामले पनि धेरै मानिसको जीवनमा सकारात्मक प्रभाव पार्न सक्छ।"
]
},

{

title:"हजुरआमाको आँगन",
content:[
"पहाडको एउटा गाउँमा पुरानो ढुङ्गे घर थियो। घरको आँगनमा तुलसीको मठ, फूलका बिरुवा र काठको बेन्च थियो। त्यही घरमा हजुरआमा एक्लै बस्नुहुन्थ्यो। उनका छोराछोरी शहरमा काम र अध्ययनका लागि गएका थिए। घर शान्त थियो, तर हजुरआमाको मनमा परिवारसँग बिताएका पुराना दिनका सम्झना सधैँ ताजा रहन्थे।",
"एक दिन विद्यालयको बिदा सुरु भएपछि उनकी नातिनी मीरा गाउँ आइपुगी। धेरै महिनापछि नातिनीलाई देख्दा हजुरआमा खुसी हुनुभयो। मीरालाई भने सुरुमा गाउँको शान्त वातावरण अलि अनौठो लाग्यो। शहरमा उसलाई मोबाइल, इन्टरनेट र साथीहरूसँगको व्यस्तता बानी परेको थियो। गाउँमा इन्टरनेट पनि राम्रो चल्दैनथ्यो।",
"पहिलो केही दिन मीरा मोबाइलमै व्यस्त भई। हजुरआमा बिहानै उठेर आँगन सफा गर्नुहुन्थ्यो, फूलमा पानी हाल्नुहुन्थ्यो र खाना बनाउनुहुन्थ्यो। उहाँले नातिनीसँग कुरा गर्न खोज्दा मीरा छोटो उत्तर दिएर फेरि मोबाइल हेर्न थाली। हजुरआमाले केही भन्नुभएन, तर नातिनीसँग समय बिताउने इच्छा भने मनमै राख्नुभयो।",
"एक बिहान मीराले हजुरआमालाई पुरानो बाकस खोल्दै गरेको देखी। बाकसभित्र पुराना तस्बिर, चिठी र केही पुस्तकहरू थिए। हजुरआमाले मीरालाई परिवारका पुराना सम्झना सुनाउन थाल्नुभयो। उहाँले कसरी गाउँमा विद्यालय स्थापना भयो, परिवारले कठिन समयमा एकअर्कालाई कसरी सहयोग गर्‍यो र चाडपर्व कसरी मनाइन्थ्यो भन्ने कुरा बताउनुभयो।",
"मीरालाई ती कुरा निकै रोचक लागे। उसले हजुरआमाका अनुभव मोबाइलमा रेकर्ड गर्न अनुमति मागी। हजुरआमाले पनि खुसी हुँदै आफ्ना सम्झना सुनाउन थाल्नुभयो। केही दिनपछि मीराले हजुरआमालाई मोबाइलबाट परिवारका फोटो हेर्न, भिडियो कल गर्न र आवश्यक सन्देश पठाउन सिकाई।",
"अब उनीहरू दुवै बिहान आँगनमा बसेर चिया पिउँथे। हजुरआमाले नातिनीलाई गाउँको इतिहास सुनाउनुहुन्थ्यो भने मीराले नयाँ प्रविधिबारे जानकारी दिन्थी। उनीहरूले एकअर्काबाट धेरै कुरा सिके। उमेर र रुचि फरक भए पनि आपसी सम्मानले सम्बन्ध नजिक बनाउँदो रहेछ भन्ने उनीहरूले अनुभव गरे।",
"बिदा सकिने दिन नजिकिँदा मीरालाई गाउँ छोड्न मन लागेन। उसले हजुरआमालाई बारम्बार भेट्न आउने वाचा गरी। शहर फर्केपछि पनि उनीहरूले नियमित कुरा गर्न थाले। मीराले हजुरआमाका कथाहरू लेखेर विद्यालयको साहित्यिक कार्यक्रममा प्रस्तुत गरी।",
"हजुरआमाको आँगनले मीरालाई एउटा ठूलो शिक्षा दियो—परिवारको सम्बन्ध समय दिएर, कुरा सुनेर र एकअर्काको अनुभवको सम्मान गरेर बलियो हुन्छ। नयाँ प्रविधि उपयोगी भए पनि परिवारसँग बिताएको समयको मूल्य कहिल्यै घट्दैन।"
]

content:[
"हिमालको काखमा एउटा सानो मुहान थियो। त्यही मुहानबाट निस्किएको पानी ढुङ्गा र चट्टान हुँदै तल बग्थ्यो। बाटोमा साना खोला मिसिन्थे र विस्तारै नदीको रूप बन्थ्यो। नदीले आफ्नो यात्रामा वन, खेत, गाउँ र शहर पार गर्थी। उसका किनारमा चराहरू बस्थे, माछाहरू पौडन्थे र मानिसहरूले पानी प्रयोग गर्थे।",
"नदीको पानीले गाउँका खेतहरू हरिया बनाउँथ्यो। किसानले धान, गहुँ र तरकारी खेती गर्थे। बालबालिका नदी किनारमा खेल्थे र चराहरूले त्यहाँबाट पानी पिउँथे। नदी गाउँको जीवनसँग जोडिएको थियो। तर समयसँगै मानिसहरूले नदीको महत्त्व बिर्सन थाले। केहीले फोहोर फाल्न थाले भने कतिपयले किनारका रुख काटे।",
"एक वर्ष लामो खडेरी पर्‍यो। मुहानमा पानी घट्न थाल्यो। नदीको बहाव कमजोर भयो। खेतमा सिँचाइ गर्न कठिन भयो र गाउँका मानिसलाई खानेपानीको समस्या हुन थाल्यो। पहिले नदीलाई सामान्य ठान्ने मानिसहरूले अब त्यसको अभाव महसुस गरे।",
"विद्यालयका शिक्षकले विद्यार्थीहरूलाई पानीका स्रोत संरक्षणबारे जानकारी दिए। विद्यार्थीहरूले मुहान वरिपरि सरसफाइ गर्ने र वृक्षरोपण गर्ने अभियान सुरु गरे। गाउँका किसानले पानीको उचित प्रयोग गर्ने योजना बनाए। कसैले पानी चुहावट रोक्यो भने कसैले वर्षाको पानी संकलन गर्न थाल्यो।",
"स्थानीय समुदायले नदी किनारमा फोहोर फाल्न नपाइने नियम बनायो। रुख काट्ने काम घटाइयो र पहिरो जाने ठाउँमा बिरुवा रोपियो। सबैले आफ्नो घर र खेतमा पानी बचत गर्ने उपाय अपनाए। केही वर्षपछि मुहान वरिपरि हरियाली बढ्न थाल्यो।",
"वर्षा ऋतुमा जमिनले पानी सोस्न थाल्यो र मुहानमा पानीको मात्रा विस्तारै बढ्यो। नदी फेरि पहिलेझैँ बग्न थाली। गाउँका खेतहरू हरिया भए। मानिसहरूले नदीको संरक्षणले आफ्नो जीवन र भविष्य दुवै सुरक्षित हुने कुरा बुझे।",
"एक दिन नदी किनारमा बसेर एक बालकले आफ्नो हजुरबुबालाई सोध्यो, 'नदी किन यति महत्त्वपूर्ण छ?' हजुरबुबाले भन्नुभयो, 'नदी केवल पानीको धार होइन। यो वन, जनावर, मानिस र सम्पूर्ण प्रकृतिलाई जोड्ने जीवनको आधार हो।'",
"त्यस दिनदेखि गाउँका बालबालिकाले नदीलाई आफ्नो साझा सम्पत्ति माने। उनीहरूले प्रकृतिसँग मिलेर बाँच्ने र पानीका स्रोत जोगाउने प्रण गरे। नदीको गीत फेरि गाउँभरि सुनिन थाल्यो।"
]

{
id:9,
category:"वातावरण सम्बन्धी कथा",
title:"हरियो विद्यालयको अभियान",
content:[
"शहरको बीचमा रहेको एउटा विद्यालयमा विद्यार्थीको संख्या धेरै थियो। विद्यालयको भवन ठूलो भए पनि वरिपरि हरियाली कम थियो। खेलमैदानको कुनामा प्लास्टिकका बोतल, कागज र अन्य फोहोर थुप्रिन्थे। कक्षाकोठाबाट निस्कने फोहोर पनि एउटै ठाउँमा फालिन्थ्यो। विद्यार्थीहरूलाई सफा वातावरण चाहिन्छ भन्ने थाहा थियो, तर त्यसका लागि सबैले नियमित प्रयास गरिरहेका थिएनन्।",
"एक दिन विज्ञान शिक्षकले वातावरण दिवसको अवसरमा विशेष कार्यक्रम आयोजना गरे। उनले विद्यार्थीलाई सोधे, 'हामीले आफ्नो विद्यालय सफा र हरियो बनाउन आजैदेखि के गर्न सक्छौँ?' विद्यार्थीहरूले धेरै सुझाव दिए। कसैले वृक्षरोपण गर्ने भन्यो, कसैले प्लास्टिक कम प्रयोग गर्ने र कसैले फोहोर छुट्याउने व्यवस्था मिलाउने प्रस्ताव राख्यो।",
"त्यसपछि विद्यालयमा हरियो अभियान सुरु भयो। प्रत्येक कक्षाले एउटा बिरुवाको जिम्मा लियो। विद्यार्थीहरूले कुहिने र नकुहिने फोहोर छुट्याउन फरक डस्टबिन राखे। शिक्षकहरूले फोहोर व्यवस्थापनबारे जानकारी दिए। क्यान्टिनमा एकपटक प्रयोग हुने प्लास्टिकका सामग्री घटाउने निर्णय गरियो।",
"अभियान सुरु भएको पहिलो हप्ता सबै उत्साहित थिए, तर केही समयपछि केही विद्यार्थीले पुरानै बानी दोहोर्‍याउन थाले। बिरुवामा पानी हाल्न बिर्सिने र फोहोर जथाभावी फाल्ने समस्या देखियो। त्यसपछि विद्यार्थी प्रतिनिधिहरूले पालो मिलाएर जिम्मेवारी बाँडे। प्रत्येक समूहले आफ्नो कामको विवरण राख्न थाल्यो।",
"विद्यालयले अभिभावक र स्थानीय समुदायलाई पनि अभियानमा सहभागी गरायो। अभिभावकहरूले घरमा पनि फोहोर छुट्याउने अभ्यास सुरु गरे। स्थानीय पसलहरूले प्लास्टिक झोलाको प्रयोग घटाउन थाले। विद्यालयको सानो प्रयास समुदायसम्म फैलिन थाल्यो।",
"केही महिनापछि विद्यालयको स्वरूप बदलियो। खाली ठाउँमा फूल र फलफूलका बिरुवा हुर्किए। खेलमैदान सफा भयो र विद्यार्थीहरूले पानी खेर नफाल्ने बानी बसाले। विद्यालयमा आउने पाहुनाहरूले पनि परिवर्तनको प्रशंसा गर्न थाले।",
"विज्ञान शिक्षकले विद्यार्थीहरूलाई भने, 'वातावरण संरक्षण कुनै एक दिनको कार्यक्रम होइन। यो हरेक दिन अपनाउनुपर्ने जीवनशैली हो। हामीले प्रकृतिबाट धेरै कुरा लिन्छौँ, त्यसैले त्यसलाई जोगाउने जिम्मेवारी पनि हाम्रो हो।'",
"विद्यार्थीहरूले वातावरणप्रति जिम्मेवार बन्ने वाचा गरे। उनीहरूले बुझे कि ठूलो परिवर्तनका लागि सधैँ ठूलो काम आवश्यक हुँदैन। साना तर निरन्तर प्रयासले पनि स्वच्छ र स्वस्थ भविष्य निर्माण गर्न सकिन्छ।"
]
},

{
id:10,
category:"विज्ञान तथा प्रविधि कथा",
title:"गाउँमा इन्टरनेटको उज्यालो",
content:[
"पहाडको टाढाको एउटा गाउँमा विद्यार्थीहरू पढाइप्रति निकै उत्साहित थिए। तर गाउँमा पुस्तकालय र शैक्षिक सामग्रीको अभाव थियो। विद्यालयमा केही पुराना पुस्तक मात्र थिए। विज्ञानका नयाँ प्रयोग, भाषा सिकाइ र विभिन्न विषयका जानकारी पाउन विद्यार्थीलाई कठिन हुन्थ्यो। उनीहरू शहरका विद्यार्थीले पाउने अवसर आफूहरूले पनि पाउन चाहन्थे।",
"एक दिन गाउँका केही युवाहरूले विद्यालयमा डिजिटल सिकाइ केन्द्र स्थापना गर्ने योजना बनाए। उनीहरूले विद्यालयका शिक्षक, अभिभावक र स्थानीय प्रतिनिधिसँग छलफल गरे। सबैले सहयोग गर्ने प्रतिबद्धता जनाए। केही कम्प्युटरको व्यवस्था गरियो र सुरक्षित इन्टरनेट जडान गर्ने तयारी सुरु भयो।",
"सुरुमा विद्यार्थीहरू कम्प्युटर चलाउन डराउँथे। शिक्षकहरूले उनीहरूलाई आधारभूत सीप सिकाए। कसरी शैक्षिक सामग्री खोज्ने, कसरी सही जानकारी छुट्याउने र कसरी आफ्नो व्यक्तिगत विवरण सुरक्षित राख्ने भन्ने विषयमा विशेष कक्षा सञ्चालन गरियो।",
"केही समयपछि विद्यार्थीहरूले अनलाइन पुस्तकालय, विज्ञानका शैक्षिक भिडियो र भाषा अभ्यास सामग्री प्रयोग गर्न थाले। उनीहरूले संसारका विभिन्न ठाउँका विद्यार्थीले कसरी अध्ययन गर्छन् भन्ने पनि जान्न पाए। प्रविधिले गाउँ र शहरबीचको दूरी घटाउन सहयोग गर्‍यो।",
"तर शिक्षकहरूले एउटा महत्त्वपूर्ण कुरा सम्झाइरहे—इन्टरनेटमा भेटिने सबै कुरा सही हुँदैन। त्यसैले विश्वसनीय स्रोत प्रयोग गर्नुपर्छ, अपरिचित व्यक्तिसँग व्यक्तिगत जानकारी बाँड्नु हुँदैन र अनलाइन समयलाई पढाइ तथा सिर्जनात्मक काममा सन्तुलित रूपमा प्रयोग गर्नुपर्छ।",
"विद्यार्थीहरूले डिजिटल सिकाइ केन्द्रबाट नयाँ सीप सिके। एक समूहले गाउँको वनस्पतिबारे डिजिटल पुस्तक तयार गर्‍यो। अर्को समूहले गाउँको इतिहास र संस्कृतिबारे जानकारी संकलन गर्‍यो। उनीहरूले आफ्नो ज्ञान अरू विद्यार्थीलाई पनि बाँडे।",
"केही महिनापछि डिजिटल केन्द्र गाउँको महत्त्वपूर्ण शैक्षिक स्थान बन्यो। विद्यालयमा पढाइको वातावरण सुधारियो र विद्यार्थीको आत्मविश्वास बढ्यो। अभिभावकले पनि प्रविधिको सही प्रयोगबारे बुझ्न थाले।",
"गाउँलेहरूले बुझे कि प्रविधि आफैँमा राम्रो वा नराम्रो हुँदैन। त्यसको उपयोग कसरी गरिन्छ भन्ने कुरा महत्त्वपूर्ण हुन्छ। ज्ञान, जिम्मेवारी र सुरक्षित व्यवहारसँग जोडिएको प्रविधिले शिक्षा र समाजको विकासमा ठूलो योगदान दिन सक्छ।"
]
},

"विद्यालयमा विज्ञान क्लब गठन भएपछि मीराले त्यसमा सहभागी हुने निर्णय गरी। शिक्षकले विद्यार्थीलाई आफूलाई लागेको प्रश्न लेखेर ल्याउन भने। मीराले चन्द्रमाको आकार किन बदलिन्छ भन्ने प्रश्न राखी। शिक्षकले चन्द्रमाको आफ्नै प्रकाश नभई सूर्यको प्रकाश परावर्तन हुने र पृथ्वीबाट देखिने उज्यालो भाग फरक हुँदा चन्द्रकलाहरू देखिने कुरा बुझाए।",

"मीराले बुझेकी थिई कि वैज्ञानिक बन्न ठूलो प्रयोगशाला मात्र चाहिँदैन। जिज्ञासु मन, सही जानकारी खोज्ने बानी, धैर्य र प्रमाणमा आधारित सोच पनि आवश्यक हुन्छ। यही सोचले उसलाई नयाँ खोजतर्फ प्रेरित गरिरह्यो।"

title:"पुस्तकालयको भेट",
content:[
"विद्यालयको पुस्तकालयमा हरेक शुक्रबार दुई विद्यार्थी भेटिन्थे। आरवलाई इतिहासका पुस्तक मन पर्थे भने मीरालाई कविता र कथा पढ्न रुचि थियो। उनीहरू एउटै कक्षामा पढ्थे, तर पुस्तकालयमा भेट भएपछि मात्र राम्रोसँग कुराकानी गर्न थाले। सुरुमा उनीहरू पुस्तक सिफारिस गर्थे र पढेका कुराबारे विचार साटासाट गर्थे।",
"एक दिन विद्यालयमा साहित्यिक प्रतियोगिता आयोजना हुने सूचना आयो। मीराले कविता प्रस्तुत गर्ने निर्णय गरी भने आरवले छोटो कथा लेख्ने सोच बनायो। दुवैले आफ्नो सिर्जना तयार पार्न थाले। उनीहरूले एकअर्काको लेखाइ पढेर सुझाव दिए। कुनै शब्द अस्पष्ट भए सुधार गर्न सहयोग गरे।",
"प्रतियोगिताको दिन मीराले प्रकृतिको सुन्दरता र मानवीय सद्भावबारे कविता सुनाई। आरवले गाउँको पुस्तकालयमा ज्ञान खोज्ने बालकको कथा प्रस्तुत गर्‍यो। दुवैको प्रस्तुति प्रशंसित भयो। उनीहरूले पुरस्कार जिते वा जितेनन् भन्नेभन्दा पनि आफ्नो सिर्जना सबैसामु प्रस्तुत गर्न पाएकोमा खुसी महसुस गरे।",
"समयसँगै उनीहरूको मित्रता अझ राम्रो हुँदै गयो। उनीहरूले परीक्षाको तयारीमा एकअर्कालाई सहयोग गरे र विद्यालयको पुस्तकालयमा नयाँ पुस्तक ल्याउन अभियान चलाए। उनीहरूको सम्बन्धमा इमानदारी, विश्वास र व्यक्तिगत सीमाको सम्मान थियो।",
"एक दिन मीराले भनिन्, 'तिमीसँग पुस्तकबारे कुरा गर्दा मलाई नयाँ कुरा सिक्न पाइन्छ।' आरवले पनि आफूलाई उनको सिर्जनशील सोच मन पर्ने बतायो। उनीहरूले आफ्नो मित्रतालाई सधैँ सम्मान र समझदारीका साथ अघि बढाउने निर्णय गरे।",
"विद्यालयको अन्तिम वर्षमा उनीहरूले पुस्तकालयका लागि स्वयंसेवा गर्ने समूह बनाए। नयाँ विद्यार्थीलाई पुस्तक छान्न सहयोग गरे र पढ्ने बानी विकास गर्न प्रेरित गरे। उनीहरूको मित्रताले अरू विद्यार्थीलाई पनि सकारात्मक काममा सहभागी हुन हौसला दियो।",
"विद्यालय सकिएपछि उनीहरू फरक अध्ययन संस्थामा गए। तर पुस्तक, साहित्य र सिर्जनात्मक कामप्रतिको रुचिले उनीहरूलाई जोडिरह्यो। उनीहरूले समय मिलाएर आफ्ना लेख र पढेका पुस्तकबारे छलफल गर्थे।",
"उनीहरूले बुझे कि सुन्दर सम्बन्धको आधार केवल भावना होइन। सम्मान, विश्वास, सहयोग, स्पष्ट संवाद र एकअर्काको विकासमा साथ दिन सक्ने क्षमता पनि उत्तिकै महत्त्वपूर्ण हुन्छ।"
]

let activeCategory = "सबै";
let currentStory = null;
let readerSize = 19;

let favorites = JSON.parse(
  localStorage.getItem("aayushFavorites") || "[]"
);

function saveFavorites(){
  localStorage.setItem(
    "aayushFavorites",
    JSON.stringify(favorites)
  );
}

function buildCategories(){

  const box = document.getElementById("categories");
  box.innerHTML = "";

  const all = ["सबै", ...categories];

  all.forEach(cat => {

    const btn = document.createElement("button");

    btn.textContent = cat;

    btn.className =
      activeCategory === cat ? "active" : "";

    btn.onclick = () => {
      activeCategory = cat;
      buildCategories();
      renderStories();
    };

    box.appendChild(btn);

  });

}

function renderStories(){

  const query = document
    .getElementById("search")
    .value.trim()
    .toLowerCase();

  const onlyFav =
    document.getElementById("sort").value === "favorites";

  const list = stories.filter(s => {

    const matchesCategory =
      activeCategory === "सबै" ||
      s.category === activeCategory;

    const matchesSearch =
      (s.title + " " + s.category + " " +
      s.content.join(" "))
      .toLowerCase()
      .includes(query);

    const matchesFav =
      !onlyFav || favorites.includes(s.id);

    return matchesCategory &&
           matchesSearch &&
           matchesFav;

  });

  document.getElementById("categoryTitle").textContent =
    activeCategory === "सबै"
      ? "सबै कथाहरू"
      : activeCategory;

  document.getElementById("count").textContent =
    `देखाइएका कथा: ${list.length}`;

  const box = document.getElementById("storyCards");

  box.innerHTML = "";

  if(!list.length){

    box.innerHTML =
      "<p>यस खोजमा कथा भेटिएन। अर्को शब्द प्रयोग गरेर खोज्नुहोस्।</p>";

    return;
  }

  list.forEach(s => {

    const card = document.createElement("article");

    card.className = "story-card";

    const excerpt =
      s.content.join(" ").slice(0,190) + "…";

    card.innerHTML = `

      <div class="meta">${escapeHTML(s.category)}</div>

      <h3>${escapeHTML(s.title)}</h3>

      <p>${escapeHTML(excerpt)}</p>

      <div class="actions">

        <button onclick="openStory(${s.id})">
          कथा पढ्नुहोस्
        </button>

        <button
          class="secondary"
          onclick="toggleFavorite(${s.id})"
        >
          ${favorites.includes(s.id)
            ? "❤️ हटाउनुहोस्"
            : "♡ मनपर्ने"}
        </button>

      </div>

    `;

    box.appendChild(card);

  });

}

function escapeHTML(value){

  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));

}

function toggleFavorite(id){

  favorites = favorites.includes(id)
    ? favorites.filter(x => x !== id)
    : [...favorites, id];

  saveFavorites();

  renderStories();

  if(currentStory && currentStory.id === id){

    document.getElementById("readFavorite").textContent =
      favorites.includes(id)
        ? "❤️ मनपर्नेमा छ"
        : "♡ मनपर्नेमा राख्नुहोस्";

  }

}

function toggleCurrentFavorite(){

  if(currentStory){
    toggleFavorite(currentStory.id);
  }

}

function openStory(id){

  const story = stories.find(s => s.id === id);

  if(!story) return;

  currentStory = story;

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("reading")
    .classList.remove("hidden");

  document.getElementById("readCategory").textContent =
    story.category;

  document.getElementById("readTitle").textContent =
    story.title;

  document.getElementById("readContent").innerHTML =
    story.content.map(p =>
      `<p>${escapeHTML(p)}</p>`
    ).join("");

  document.getElementById("readFavorite").textContent =
    favorites.includes(id)
      ? "❤️ मनपर्नेमा छ"
      : "♡ मनपर्नेमा राख्नुहोस्";

  document.getElementById("readContent")
    .style.fontSize = readerSize + "px";

  window.scrollTo(0,0);

}

function showHome(){

  document.getElementById("reading")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");

  currentStory = null;

  renderStories();

}

function showFavorites(){

  document.getElementById("sort").value = "favorites";

  activeCategory = "सबै";

  buildCategories();

  showHome();

}

function changeTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "aayushTheme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}

function changeFont(amount){

  readerSize = Math.max(
    14,
    Math.min(32, readerSize + amount)
  );

  if(currentStory){

    document.getElementById("readContent")
      .style.fontSize = readerSize + "px";

  }

}

if(localStorage.getItem("aayushTheme") === "dark"){
  document.body.classList.add("dark");
}

buildCategories();
renderStories();

</script>
