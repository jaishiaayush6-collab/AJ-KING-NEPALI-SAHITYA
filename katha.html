<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>आयुस नेपाली साहित्य | कथा संग्रह</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Noto Sans Devanagari",sans-serif;
    background:#f4f6fb;
    color:#222;
    line-height:1.9;
}

header{
    background:linear-gradient(135deg,#172554,#2563eb);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{font-size:30px}
header p{margin-top:5px}

nav{
    background:#111827;
    padding:12px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:7px;
    display:inline-block;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
}

input,select,button{
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-family:inherit;
    font-size:15px;
}

input{flex:1;min-width:200px}

button{
    background:#2563eb;
    color:white;
    border:0;
    cursor:pointer;
}

button:hover{opacity:.85}

.story-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
    margin-top:20px;
}

.card{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px #00000012;
    border-left:5px solid #2563eb;
}

.card h3{color:#1d4ed8;margin-bottom:8px}
.card p{font-size:14px;color:#666;margin-bottom:10px}
.card button{width:100%;margin-top:8px}

#count{margin:12px 0;color:#555}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    background:#000000bd;
    overflow-y:auto;
    padding:20px;
}

.modal-content{
    background:white;
    color:#222;
    max-width:850px;
    margin:20px auto;
    padding:25px;
    border-radius:12px;
}

.modal-content h2{color:#1d4ed8;margin-bottom:8px}
.modal-content p{text-align:justify;margin:16px 0}

.reader-tools{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:15px 0;
}

.close{background:#dc2626}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

body.dark{background:#111827;color:#eee}
body.dark .card,body.dark .modal-content{
    background:#1f2937;
    color:#eee;
}
body.dark .card p{color:#ddd}
body.dark #count{color:#ddd}
body.dark .card h3,body.dark .modal-content h2{color:#93c5fd}

@media(max-width:600px){
    header h1{font-size:23px}
    .modal-content{padding:16px}
}
</style>
</head>

<body>

<header>
    <h1>आयुस नेपाली साहित्य</h1>
    <p>नेपाली कथा संग्रह</p>
    <p>पढौँ, सिकौँ र साहित्यको सिर्जना गरौँ।</p>
</header>

<nav>
    <a href="index.html">गृहपृष्ठ</a>
    <a href="katha.html">कथा</a>
    <a href="kabita.html">कविता</a>
    <a href="bal-sahitya.html">बाल साहित्य</a>
    <a href="nibandha.html">निबन्ध</a>
</nav>

<div class="container">

    <h2>📚 हाम्रो कथा संग्रह</h2>
    <p>विभिन्न विधाका १०० वटा नमुना कथा पढ्नुहोस्।</p>

    <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="कथाको शीर्षक खोज्नुहोस्..."
            oninput="showStories()"
        >

        <select id="category" onchange="showStories()">
            <option value="सबै">सबै विधा</option>
            <option value="प्रेरणादायी कथा">प्रेरणादायी कथा</option>
            <option value="सामाजिक कथा">सामाजिक कथा</option>
            <option value="नैतिक कथा">नैतिक कथा</option>
            <option value="बाल कथा">बाल कथा</option>
            <option value="ऐतिहासिक कथा">ऐतिहासिक कथा</option>
            <option value="देशभक्ति कथा">देशभक्ति कथा</option>
            <option value="पारिवारिक कथा">पारिवारिक कथा</option>
            <option value="प्रकृति कथा">प्रकृति कथा</option>
            <option value="विज्ञान तथा प्रविधि कथा">विज्ञान तथा प्रविधि कथा</option>
            <option value="रहस्यात्मक कथा">रहस्यात्मक कथा</option>
        </select>

        <button onclick="toggleDark()">🌙 डार्क मोड</button>
    </div>

    <p id="count"></p>

    <div class="story-grid" id="storyGrid"></div>

</div>

<div class="modal" id="reader">
    <div class="modal-content">

        <button class="close" onclick="closeStory()">बन्द गर्नुहोस् ✖</button>

        <h2 id="storyTitle"></h2>
        <p id="storyInfo"></p>

        <div class="reader-tools">
            <button onclick="changeFont(1)">A+ अक्षर ठूलो</button>
            <button onclick="changeFont(-1)">A- अक्षर सानो</button>
        </div>

        <div id="storyContent"></div>

        <br>
        <button onclick="closeStory()">कथा बन्द गर्नुहोस्</button>

    </div>
</div>

<footer>
    <h3>आयुस नेपाली साहित्य</h3>
    <p>लेखक: Aayush Jaishi</p>
    <p>© 2026 Aayush Nepali Sahitya</p>
</footer>

// प्रत्येक कथामा पाँचवटा छुट्टाछुट्टै अनुच्छेद छन्।
const stories = [

/* १–१०: प्रेरणादायी कथा */

{
title:"अँध्यारोबाट उज्यालोतर्फ",
category:"प्रेरणादायी कथा",
p:[
"पहाडको एउटा सानो गाउँमा रमेश नाम गरेको बालक बस्थ्यो। उसको परिवार सामान्य आर्थिक अवस्थाको थियो। विद्यालय जान उसले लामो बाटो हिँड्नुपर्थ्यो। तर उसको मनमा ठूलो सपना थियो।",
"रमेश पढाइमा राम्रो गर्न चाहन्थ्यो। घरमा बिजुली नहुँदा राति पढ्न कठिन हुन्थ्यो। उसले दिउँसो विद्यालयमै बसेर गृहकार्य पूरा गर्ने उपाय निकाल्यो।",
"एक दिन विद्यालयमा छात्रवृत्तिका लागि परीक्षा हुने सूचना आयो। रमेशले समयको सदुपयोग गर्दै नियमित अध्ययन गर्न थाल्यो। उसका साथीहरू खेल्दा पनि ऊ आफ्नो लक्ष्य सम्झन्थ्यो।",
"परीक्षाको नतिजा आउँदा रमेशले राम्रो सफलता प्राप्त गर्‍यो। शिक्षकहरूले उसको मेहनतको प्रशंसा गरे। उसले छात्रवृत्ति पाएपछि परिवारको पढाइ खर्चमा पनि सहयोग पुग्यो।",
"रमेशले बुझ्यो कि कठिन परिस्थिति सफलताको अन्त्य होइन। दृढ इच्छा, नियमित अभ्यास र धैर्यले जीवनमा परिवर्तन ल्याउन सकिन्छ।"
]},

{
title:"हारपछि सुरु भएको यात्रा",
category:"प्रेरणादायी कथा",
p:[
"सुमनलाई चित्र बनाउन निकै मन पर्थ्यो। तर विद्यालयको चित्रकला प्रतियोगितामा उसले लगातार दुई वर्ष पुरस्कार जित्न सकेन। साथीहरूको प्रशंसा सुन्दा उसलाई आफ्नो क्षमता कमजोर भएको जस्तो लाग्थ्यो।",
"एक दिन उसका कला शिक्षकले उसलाई निराश नहुन सम्झाए। शिक्षकले गल्ती पत्ता लगाएर अभ्यास गर्न सुझाव दिए। सुमनले आफ्ना पुराना चित्रहरू ध्यानपूर्वक हेर्न थाल्यो।",
"उसले दैनिक एउटा नयाँ चित्र बनाउने अभ्यास गर्‍यो। प्रकृति, मानिस र गाउँका दृश्यहरू हेरेर चित्र बनाउन सिक्यो। उसले अरूका सुझाव पनि ग्रहण गर्‍यो।",
"अर्को वर्ष प्रतियोगिता हुँदा सुमनले आफ्नो नयाँ चित्र प्रस्तुत गर्‍यो। यसपटक उसले उत्कृष्ट चित्रको पुरस्कार जित्यो। उसलाई सबैभन्दा धेरै खुसी आफ्नै प्रगतिले बनायो।",
"उसले सिक्यो कि असफलता अन्तिम निर्णय होइन। गल्तीबाट सिकेर निरन्तर अघि बढ्ने मानिसले आफ्नो सीप विकास गर्न सक्छ।"
]},

{
title:"सानो पसलको ठूलो सपना",
category:"प्रेरणादायी कथा",
p:[
"कृष्णको परिवार गाउँमा सानो किराना पसल चलाउँथ्यो। पसलबाट आउने आम्दानीले परिवारको सामान्य खर्च मात्र पुग्थ्यो। कृष्ण भने आफ्नो गाउँमा राम्रो पुस्तक पसल खोल्ने सपना देख्थ्यो।",
"उसले पहिले बजारमा पुस्तकको माग कस्तो छ भनेर बुझ्यो। विद्यालयका शिक्षक र विद्यार्थीहरूसँग कुरा गर्‍यो। थोरै रकम बचत गर्न उसले अनावश्यक खर्च घटायो।",
"केही महिनापछि उसले पुरानो कोठा सफा गरेर सानो पुस्तक कुनो बनायो। त्यहाँ पाठ्यपुस्तक, कथा र सामान्य ज्ञानका पुस्तक राख्यो। विद्यार्थीहरू बिस्तारै आउन थाले।",
"पसलबाट आएको आम्दानी उसले फेरि पुस्तक थप्न प्रयोग गर्‍यो। गाउँका बालबालिकाले सजिलै पुस्तक पाउन थाले। उसको सानो प्रयासले गाउँमा पढ्ने वातावरण बनायो।",
"कृष्णले ठूलो काम सुरु गर्न ठूलो भवन चाहिँदैन भन्ने बुझ्यो। स्पष्ट योजना र निरन्तर मेहनत भए सानो सुरुवातले पनि राम्रो परिवर्तन ल्याउन सक्छ।"
]},

{
title:"आत्मविश्वासको पहिलो पाइला",
category:"प्रेरणादायी कथा",
p:[
"माया कक्षामा पढाइमा राम्रो भए पनि सबैका अगाडि बोल्न डराउँथी। शिक्षकले प्रश्न सोध्दा उत्तर थाहा भएर पनि ऊ चुप लाग्थी। उसलाई साथीहरूले हाँस्लान् भन्ने चिन्ता हुन्थ्यो।",
"एक दिन विद्यालयमा वक्तृत्वकला प्रतियोगिताको सूचना आयो। मायाकी शिक्षिकाले उसलाई सहभागी हुन प्रोत्साहित गरिन्। मायाले सुरुमा अस्वीकार गरे पनि पछि प्रयास गर्ने निर्णय गरिन्।",
"उसले घरमा ऐनाअगाडि उभिएर बोल्ने अभ्यास गरिन्। आमाले उसको कुरा सुनिन् र उच्चारण सुधार्न सहयोग गरिन्। साथीहरूसँग पनि छोटो प्रस्तुति अभ्यास गरिन्।",
"प्रतियोगिताको दिन माया मञ्चमा उभिइन्। सुरुमा आवाज केही काँप्यो, तर केही बेरपछि उनी सहज भइन्। उनले आफ्नो कुरा पूरा गरिन् र प्रशंसा पाइन्।",
"त्यस दिन मायाले आत्मविश्वास एकैपटक आउँदैन भन्ने बुझिन्। सानो प्रयासबाट सुरु गरिएको अभ्यासले ठूलो परिवर्तन ल्याउन सक्छ।"
]},

{
title:"मेहनतको सुनौलो फल",
category:"प्रेरणादायी कथा",
p:[

"प्रशिक्षकले उसलाई निराश नहुन र आफ्नो कमजोरीमा काम गर्न सल्लाह दिए। दीपकले साथीहरूसँग नियमित अभ्यास गर्ने निर्णय गर्‍यो।",
"ऊ बिहान दौडिन्थ्यो र विद्यालयपछि बल नियन्त्रण गर्ने अभ्यास गर्थ्यो। उसले खेलका नियम पनि ध्यानपूर्वक पढ्यो। बिस्तारै उसको खेलमा सुधार आउन थाल्यो।",
"अर्को छनोटमा दीपक विद्यालयको टोलीमा पर्न सफल भयो। उसले मैदानमा राम्रो प्रदर्शन गर्‍यो। टोलीले प्रतियोगितामा राम्रो स्थान हासिल गर्‍यो।",
"दीपकले प्रतिभा मात्र पर्याप्त हुँदैन भन्ने सिक्यो। अनुशासन, अभ्यास र टोलीसँग मिलेर काम गर्ने बानीले सफलता नजिक ल्याउँछ।"
]},

{
title:"एक पुस्तकले बदलिएको जीवन",
category:"प्रेरणादायी कथा",
p:[
"नवीनलाई खाली समयमा मोबाइल चलाउने बानी थियो। पढाइमा उसको रुचि घट्दै गएको थियो। एक दिन विद्यालयको पुस्तकालयमा उसले प्रेरणादायी व्यक्तिको जीवनी भेट्टायो।",

"केही महिनापछि नवीनको भाषा र सामान्य ज्ञानमा सुधार आयो। कक्षामा छलफल हुँदा ऊ आत्मविश्वासका साथ बोल्न थाल्यो। उसका साथीहरूले पनि पुस्तक पढ्न रुचि देखाए।",
"नवीनले पुस्तकले नयाँ संसार चिनाउने रहेछ भन्ने अनुभव गर्‍यो। राम्रो पुस्तकले सोच, व्यवहार र भविष्यको बाटो बदल्न सहयोग गर्न सक्छ।"
]},

{
title:"आफ्नै बाटो बनाउने साहस",
category:"प्रेरणादायी कथा",
p:[
"अनिललाई कृषि प्रविधिमा रुचि थियो। गाउँका धेरै मानिसले खेतीलाई परम्परागत तरिकाले मात्र गर्नुपर्छ भन्ने सोच्थे। अनिल भने नयाँ विधि सिक्न चाहन्थ्यो।",
