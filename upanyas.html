
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>उपन्यास संग्रह | AAYUSH नेपाली साहित्य</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans Devanagari",Arial,sans-serif;
    background:#f4f0e8;
    color:#292929;
    transition:0.3s;
}

header{
    background:linear-gradient(135deg,#32134f,#713b91);
    color:white;
    padding:35px 15px;
    text-align:center;
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    font-size:16px;
    color:#eee;
}

nav{
    background:#241332;
    padding:14px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-size:15px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 15px;
}

.heading{
    text-align:center;
    margin-bottom:25px;
}

.heading h2{
    color:#713b91;
    font-size:27px;
    margin-bottom:10px;
}

.controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:25px;
}

input,select,button{
    padding:12px 16px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

input{
    width:280px;
}

button{
    cursor:pointer;
    background:#713b91;
    color:white;
    border:none;
}

button:hover{
    background:#32134f;
}

.stats{
    text-align:center;
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:25px;
    color:#713b91;
    font-weight:bold;
}

.category-title{
    font-size:23px;
    color:#713b91;
    margin:25px 0 15px;
    border-bottom:2px solid #713b91;
    padding-bottom:10px;
}

.book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.book{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 12px #00000012;
    transition:0.3s;
    border-top:4px solid #713b91;
}

.book:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px #00000020;
}

.book .number{
    color:#9b72b3;
    font-size:13px;
}

.book h3{
    margin:12px 0;
    color:#54216e;
    font-size:19px;
}

.book p{
    font-size:14px;
    line-height:1.9;
    color:#555;
    margin-bottom:15px;
}

.book button{
    width:100%;
}

#reader{
    display:none;
    background:white;
    padding:25px;
    border-radius:12px;
    margin-top:30px;
    line-height:2;
    box-shadow:0 3px 15px #0002;
}

#reader h2{
    color:#713b91;
    margin-bottom:15px;
}

#reader button{
    margin-top:15px;
}

.empty{
    text-align:center;
    padding:35px;
    display:none;
}

footer{
    background:#241332;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
    line-height:2;
}

body.dark{
    background:#17131d;
    color:#eee;
}

body.dark .book,
body.dark .stats,
body.dark #reader{
    background:#292331;
    color:white;
}

body.dark .book p{
    color:#ddd;
}

body.dark .book h3,
body.dark .heading h2,
body.dark .category-title{
    color:#d7a8f4;
}

body.purple{
    background:#eee5fa;
    color:#32134f;
}

body.purple .book{
    background:#f8f0ff;
}

@media(max-width:600px){
    header h1{
        font-size:26px;
    }
    nav a{
        display:inline-block;
        margin:7px;
    }
    input{
        width:100%;
    }
}
</style>
</head>
